name: Release

# Publishes a GitHub Release with the Windows EXE/ZIP and the Linux tar.gz/.deb packages (x64 and ARM64)
# when a version tag such as v0.1.0 is pushed, or when started by hand from main with a version number
# (the release job then creates the tag on the built commit).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm (ör. 0.2.0); v<sürüm> etiketi main üzerinde oluşturulur'
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  windows:
    name: Windows packages (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF -ne 'refs/heads/main') { throw "Manual releases run from main only." }
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Unexpected tag: $env:TAG" }
          "value=$($env:TAG.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/DeployNest.Tests/DeployNest.Tests.csproj -c Release

      - name: Build release packages
        shell: pwsh
        run: ./scripts/publish.ps1 -Version ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: artifacts/release/*
          if-no-files-found: error

  linux:
    name: Linux packages (x64, ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Read version from tag
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then echo "Manual releases run from main only." >&2; exit 1; fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected tag: $TAG" >&2; exit 1; }
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test tests/DeployNest.Tests/DeployNest.Tests.csproj -c Release -p:EnableWindowsTargeting=true

      - name: Build release packages
        run: |
          ./scripts/publish-linux.sh ${{ steps.version.outputs.value }} linux-x64
          ./scripts/publish-linux.sh ${{ steps.version.outputs.value }} linux-arm64

      - uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: artifacts/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          cat > notes.md <<NOTES
          DeployNest $TAG — Windows 10 / 11 (x64) ve Linux (x64, ARM64).

          **Windows**
          - \`DeployNest-$version-win-x64.exe\`: kurulum gerektirmeyen tek dosya (.NET dahil).
          - \`DeployNest-$version-win-x64-portable.zip\`: aynı EXE + README + lisanslar.
          - \`SHA256SUMS.txt\`: Windows dosyalarının SHA-256 özetleri.

          EXE henüz kod imzalı olmadığından Windows SmartScreen uyarı gösterebilir.

          **Linux** (Ubuntu, Debian, Mint, Fedora, Arch ve türevleri)
          - \`DeployNest-$version-linux-x64.tar.gz\` / \`DeployNest-$version-linux-arm64.tar.gz\`: her dağıtımda çalışır; arşivi açıp \`./install.sh\` çalıştır (yönetici izni gerekmez).
          - \`deploynest_${version}_amd64.deb\` / \`deploynest_${version}_arm64.deb\`: Debian, Ubuntu ve Linux Mint paketi.
          - \`SHA256SUMS-linux.txt\`: Linux dosyalarının SHA-256 özetleri.

          Değişiklikler için CHANGELOG.md dosyasına bakın.
          NOTES
          # --target only matters for manual runs, where the tag does not exist yet.
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "DeployNest $TAG" --notes-file notes.md
