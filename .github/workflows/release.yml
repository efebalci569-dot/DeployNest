name: Release

# Publishes a GitHub Release when a version tag such as v0.1.0 is pushed:
# the Windows EXE/ZIP and the Linux tar.gz/.deb packages (x64 and ARM64).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  windows:
    name: Windows packages (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected tag: ${{ github.ref_name }}" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/DeployNest.Tests/DeployNest.Tests.csproj -c Release

      - name: Build release packages
        shell: pwsh
        run: ./scripts/publish.ps1 -Version ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: artifacts/release/*
          if-no-files-found: error

  linux:
    name: Linux packages (x64, ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Read version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected tag: $GITHUB_REF_NAME" >&2; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test tests/DeployNest.Tests/DeployNest.Tests.csproj -c Release -p:EnableWindowsTargeting=true

      - name: Build release packages
        run: |
          ./scripts/publish-linux.sh ${{ steps.version.outputs.value }} linux-x64
          ./scripts/publish-linux.sh ${{ steps.version.outputs.value }} linux-arm64

      - uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: artifacts/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          cat > notes.md <<NOTES
          DeployNest $TAG — Windows 10 / 11 (x64) ve Linux (x64, ARM64).

          **Windows**
          - \`DeployNest-$version-win-x64.exe\`: kurulum gerektirmeyen tek dosya (.NET dahil).
          - \`DeployNest-$version-win-x64-portable.zip\`: aynı EXE + README + lisanslar.
          - \`SHA256SUMS.txt\`: Windows dosyalarının SHA-256 özetleri.

          EXE henüz kod imzalı olmadığından Windows SmartScreen uyarı gösterebilir.

          **Linux** (Ubuntu, Debian, Mint, Fedora, Arch ve türevleri)
          - \`DeployNest-$version-linux-x64.tar.gz\` / \`DeployNest-$version-linux-arm64.tar.gz\`: her dağıtımda çalışır; arşivi açıp \`./install.sh\` çalıştır (yönetici izni gerekmez).
          - \`deploynest_${version}_amd64.deb\` / \`deploynest_${version}_arm64.deb\`: Debian, Ubuntu ve Linux Mint paketi.
          - \`SHA256SUMS-linux.txt\`: Linux dosyalarının SHA-256 özetleri.

          Değişiklikler için CHANGELOG.md dosyasına bakın.
          NOTES
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "DeployNest $TAG" --notes-file notes.md
